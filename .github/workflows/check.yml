# The same command as locally: devenv test runs the pre-commit hooks over all files, then assay check. assay reads
# the base of the change from GitHub's event itself, so nothing here sets ASSAY_BASE; fetch-depth 0 puts the base in
# the clone.
name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - run: nix profile add nixpkgs#devenv
      - run: devenv test
